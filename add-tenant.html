<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Tenant | P-rent</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>P-rent</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="apartments.html">Apartments</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="add-tenant.html">Add Tenant</a></li>
                 <li><a href="login.html">Account</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE HEADER -->
        <section class="page-header">
            <h2>Add New Tenant</h2>
            <p>Fill in the form below to register a tenant.</p>
        </section>

        <!-- FORM SECTION -->
        <section class="form-section">
            <form id="tenant-form">

                <!-- TENANT NAME -->
                <div class="form-group">
                    <label for="tenant-name">Tenant Name</label>
                    <input type="text" id="tenant-name" placeholder="Enter tenant name" />
                    <small class="error" id="name-error"></small>
                </div>

                <!-- APARTMENT -->
                <div class="form-group">
                    <label for="apartment-name">Apartment Name</label>
                    <input type="text" id="apartment-name" placeholder="Enter apartment name" />
                    <small class="error" id="apartment-error"></small>
                </div>

                <!-- ROOM NUMBER -->
                <div class="form-group">
                    <label for="room-number">Room Number</label>
                    <input type="text" id="room-number" placeholder="Enter room number" />
                    <small class="error" id="room-error"></small>
                </div>

                <!-- RENT AMOUNT -->
                <div class="form-group">
                    <label for="rent-amount">Rent Amount</label>
                    <input type="number" id="rent-amount" placeholder="Enter rent amount" />
                    <small class="error" id="rent-error"></small>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">Add Tenant</button>

            </form>
        </section>

        <!-- TENANT LIST -->
        <section class="tenant-list-section">
            <h2>Registered Tenants</h2>
            <div id="tenant-list" class="tenant-container">
                <!-- Tenant cards appear here -->
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 P-rent Apartment Management System</p>
    </footer>

    <script src="js/tenant.js"></script>
</body>
</html>
