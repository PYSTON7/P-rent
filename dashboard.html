<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenant Dashboard | P-rent</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<!-- HEADER -->
<header>
    <nav class="navbar">

        <div class="logo">
            <h1>P-rent</h1>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="apartments.html">Apartments</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li>
                <button id="logout-btn" class="logout-btn">
                    Logout
                </button>
            </li>
        </ul>

    </nav>
</header>


<!-- MAIN -->
<main>

    <!-- HEADER -->
    <section class="page-header">

        <h2>Tenant Dashboard</h2>

        <h3 id="tenant-name-display"></h3>

        <p id="tenant-apartment-display"></p>

    </section>


    <!-- BALANCE CARDS -->
    <section class="dashboard-container">

        <article class="dashboard-card">
            <h3>Rent Balance</h3>
            <p id="rent-balance">KES 0</p>
        </article>

        <article class="dashboard-card">
            <h3>Water Bill</h3>
            <p id="water-bill">KES 0</p>
        </article>

    </section>


    <!-- RENT PAYMENT FORM -->
    <section class="form-section">

        <h2>Make Payment</h2>

        <form id="payment-form">

            <div class="form-group">

                <label>Amount (KES)</label>

                <input
                    type="number"
                    id="payment-amount"
                    placeholder="Enter amount"
                />

                <small class="error" id="payment-error"></small>

            </div>

            <button type="submit" class="submit-btn">
                Pay Rent (Local)
            </button>

        </form>

    </section>


    <!-- M-PESA SECTION -->
    <section class="form-section">

        <h2>M-Pesa Payment</h2>

        <div>

            <input
                type="tel"
                id="mpesa-phone"
                placeholder="2547XXXXXXXX"
            />

            <small class="error" id="mpesa-error"></small>

            <button id="mpesa-pay-btn" class="submit-btn">
                Pay via M-Pesa
            </button>

        </div>

    </section>


    <!-- PAYMENT HISTORY -->
    <section class="payment-history">

        <h2>Payment History</h2>

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="payment-table-body"></tbody>

        </table>

    </section>

</main>


<!-- FOOTER -->
<footer>
    <p>&copy; 2026 P-rent System</p>
</footer>


<!-- JS -->
<script src="js/dashboard.js"></script>

</body>
</html>
