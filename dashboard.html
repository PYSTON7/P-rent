<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenant Dashboard | P-rent</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <h1>P-rent</h1>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="apartments.html">Apartments</a></li>
                <li><a href="login.html">Account</a></li>
            </ul>

        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE HEADER -->
        <section class="page-header">
            <h2>Tenant Dashboard</h2>

            <p>
                View rent balance, water bills, and payment history.
            </p>
        </section>

        <!-- DASHBOARD CARDS -->
        <section class="dashboard-container">

            <!-- RENT BALANCE -->
            <article class="dashboard-card">
                <h3>Rent Balance</h3>

                <p id="rent-balance">
                    KES 0
                </p>

                <button id="pay-rent-btn" class="dashboard-btn">
                    Pay Rent
                </button>
            </article>

            <!-- WATER BILL -->
            <article class="dashboard-card">
                <h3>Water Bill</h3>

                <p id="water-bill">
                    KES 0
                </p>

                <button id="pay-water-btn" class="dashboard-btn">
                    Pay Water Bill
                </button>
            </article>

        </section>

        <!-- PAYMENT HISTORY -->
        <section class="payment-history">

            <h2>Payment History</h2>

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Payment Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="payment-table-body">

                        <!-- Data inputed -->

                </tbody>

            </table>

        </section>

    </main>

<!-- footer Section -->
      <footer>
        <p>
            &copy; 2026 P-rent Apartment Management System
        </p>
    </footer>

    <script src="js/dashboard.js"></script>
</body>
</html>
