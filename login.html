<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | P-rent</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>P-rent</h1>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <section class="page-header">
            <h2>Welcome to P-rent</h2>
            <p>Login to access your account</p>
        </section>

        <section class="form-section">

            <!-- ROLE TOGGLE -->
            <div class="role-toggle">
                <button id="tenant-toggle" class="toggle-btn active" onclick="switchRole('tenant')">
                    Tenant
                </button>
                <button id="landlord-toggle" class="toggle-btn" onclick="switchRole('landlord')">
                    Landlord
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form">

                <h3 id="form-title">Tenant Login</h3>

                <!-- PHONE NUMBER -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number e.g 0712345678"
                    />
                    <small class="error" id="phone-error"></small>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    />
                    <small class="error" id="password-error"></small>
                </div>

                <!-- GENERAL ERROR -->
                <small class="error" id="login-error"></small>

                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">Login</button>

                <!-- REGISTER LINK -->
                <p class="register-link">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 P-rent Apartment Management System</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
